const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angDiff = (a, b) => ((b - a + Math.PI * 3) % TAU) - Math.PI;
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  return dist2(cx, cy, nx, ny) < r * r;
}
// 点到线段的最近点
function segClosest(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy || 1;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / l, 0, 1);
  return { x: x1 + dx * t, y: y1 + dy * t, t };
}

// 所有关卡共用一张自适应网格，输入和绘制使用相同的矩形。

// Compact arrays in place; callers can return expired objects to a pool.
function compact(array, keep, recycle) {

}

// Exact incremental 5×5 box sums. Each changed sample affects only 25 outputs.
// Inclusive dirty coordinates, flushed as non-overlapping horizontal tile runs.
class DirtyTiles {
  constructor(width, height, block = 16) {
    this.width = width; this.height = height; this.block = block;

  }

  mark(x0, y0, x1, y1) {
    if (this.all || x1 < 0 || y1 < 0 || x0 >= this.width || y0 >= this.height) return;
    const b = this.block;
    const l = Math.max(0, Math.floor(x0 / b)), r = Math.min(this.cols - 1, Math.floor(x1 / b));
    const t = Math.max(0, Math.floor(y0 / b)), d = Math.min(this.rows - 1, Math.floor(y1 / b));
    for (let y = t; y <= d; y++) this.flags.fill(1, y * this.cols + l, y * this.cols + r + 1);
    this.pending = true;
  }
  flush(draw) {
    if (this.all) { draw(0, 0, this.width, this.height); this.flags.fill(0); this.all = this.pending = false; return; }
    if (!this.pending) return;
    const b = this.block;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols;) {
      if (!this.flags[y * this.cols + x]) { x++; continue; }
      const first = x;
      while (x < this.cols && this.flags[y * this.cols + x]) { this.flags[y * this.cols + x] = 0; x++; }
      draw(first * b, y * b, Math.min(this.width, x * b) - first * b, Math.min(b, this.height - y * b));
    }
    this.pending = false;
  }
}

// Preferences are independent of rendering quality and the simulation clock.
const Settings = (() => {
  const defaults = { assistVersion: 2, autoTouch: false, autoDesktop: false, aimTouch: false, aimDesktop: false, motion: 1, controls: 1, opacity: 0.65, music: 0.38, sfx: 0.8, stick: 'floating', positions: { portrait: {}, landscape: {} } };
  const S = { ...defaults, positions: { portrait: {}, landscape: {} }, safe: { top: 0, right: 0, bottom: 0, left: 0 } };
  S.load = store => {
    S.store = store;
    try {
      const v = JSON.parse(store.get('settings7') || '{}');
      for (const k of ['autoTouch', 'autoDesktop', 'aimTouch', 'aimDesktop']) S[k] = v.assistVersion === defaults.assistVersion && typeof v[k] === 'boolean' ? v[k] : false;
      for (const [k, lo, hi] of [['motion', 0, 1], ['controls', 0.8, 1.3], ['opacity', 0.35, 1], ['music', 0, 1], ['sfx', 0, 1]]) if (Number.isFinite(v[k])) S[k] = clamp(v[k], lo, hi);
      if (v.stick === 'fixed' || v.stick === 'floating') S.stick = v.stick;
      for (const mode of ['portrait', 'landscape']) for (const name of ['jump', 'dash', 'ult', 'swap', 'use', 'moveHome', 'aimHome']) {
        const p = v.positions?.[mode]?.[name];
        if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) S.positions[mode][name] = { x: clamp(p.x, 0, 1), y: clamp(p.y, 0, 1) };
      }
    } catch (_) {}
  };
  S.save = () => {
    if (!S.store) return;
    const value = {};
    for (const k of Object.keys(defaults)) value[k] = S[k];
    S.store.set('settings7', JSON.stringify(value));
  };
  S.auto = touch => S[touch ? 'autoTouch' : 'autoDesktop'];
  S.aim = touch => S[touch ? 'aimTouch' : 'aimDesktop'];
  S.toggle = (kind, touch) => { const key = (kind === 'auto' ? 'auto' : 'aim') + (touch ? 'Touch' : 'Desktop'); S[key] = !S[key]; S.save(); };
  return S;
})();

// ===== src/input.js =====
// ---------------- 输入抽象（平台层只负责把原始事件喂进来） ----------------
// 像《元气骑士》一样：自己瞄、自己开火。
// 电脑：WASD 移动，鼠标瞄准，按住左键开火，右键 / Shift 翻滚，空格跳，E 打嗝，Q / 滚轮换枪，F 捡武器。
// 手机：左半屏移动摇杆；右半屏瞄准摇杆，拖出去就朝那个方向开火；右侧按钮跳 / 滚 / 嗝 / 换枪。
const Input = (() => {
  const keys = Object.create(null);
  const freshEdge = () => ({ dash: false, ult: false, jump: false, swap: false, use: false, pick: 0, start: false, mute: false, back: false, pause: false, auto: false, assistAim: false });
  const I = {
    W: 1, H: 1,
    touchMode: false, coarse: false, forceTouch: false, viewRoll: 0,
    useOn: false,        // 平台层每帧写入：身边有没有能捡的武器（决定“捡”按钮出不出现）
    mouse: { x: 0, y: 0, down: false, moved: false },
    moveStick: null, aimStick: null, held: {},
    taps: [], edge: freshEdge(),
    keyDown(code) {
      if (!keys[code]) {
        const e = I.edge;
        if (code === 'Space' || code === 'KeyL') e.jump = true;
        if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyK') e.dash = true;
        if (code === 'KeyE') e.ult = true;
        if (code === 'KeyQ' || code === 'Tab') e.swap = true;
        if (code === 'KeyF') e.use = true;
        if (/^Digit[1-7]$/.test(code)) e.pick = +code.slice(5);
        if (code === 'KeyP' || code === 'Escape') e.pause = true;
        if (code === 'KeyM') e.mute = true;
        if (code === 'KeyV') e.auto = true;
        if (code === 'KeyB') e.assistAim = true;
        if (code === 'Enter' || code === 'Space') e.start = true;
        if (code === 'Escape') e.back = true;
        if (!I.forceTouch) I.touchMode = false;
      }
      keys[code] = true;
    },
    keyUp(code) { keys[code] = false; },
    wheel() { I.edge.swap = true; },
    // kind: 'mouse' | 'touch' | 'pen' ; button: 0 左 1 中 2 右
    pointerDown(id, x, y, kind, button) {
      I.taps.push({ x, y });
      const L = hudLayout(I.W, I.H), e = I.edge;
      const on = (b, pad = 5) => dist2(x, y, b.x, b.y) < (Math.max(24, b.r) + pad) ** 2;
      // Menu taps never start a joystick or latch a mouse trigger.
      if (I.menu) return;
      if (on(L.pause)) { e.pause = true; return; }
      if (on(L.auto)) { e.auto = true; return; }
      if (on(L.aim)) { e.assistAim = true; return; }
      if (kind === 'touch' || kind === 'pen') {
        I.touchMode = true;

// Browser lifecycle. Active play follows the display cadence at full quality.
const Platform = (() => {

    if (!audioDrag) return;

  }
